[package]
name = "cutterhoochee"
version = "0.1.0"
description = "Cutterhoochee desktop video editor"
authors = ["Cutterhoochee contributors"]
license = "Apache-2.0"
repository = "https://github.com/openhoo/cutterhoochee"
homepage = "https://github.com/openhoo/cutterhoochee"
edition = "2021"
rust-version = "1.95"
build = "build.rs"

[lib]
name = "cutterhoochee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cutterhoochee"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
keyring = { version = "4.2", features = ["v1"] }
libc = "0.2"
fs2 = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
png = "0.17.16"
quick-xml = "0.42"
resvg = "0.45"
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
ts-rs = "10"
ttf-parser = "0.25"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[example]]
name = "generate-types"
path = "examples/generate-types.rs"

# gtk-rs fixed this unsound VariantStrIter out-parameter in upstream commit
# https://github.com/gtk-rs/gtk-rs-core/commit/b5a4071e439bef2b5eea76c3aa25e5ae84839e34
# (RUSTSEC-2024-0429), but no patched 0.18.x release was published. Keep
# the GTK3-compatible 0.18.5 API and apply that exact two-line backport.
[patch.crates-io]
glib = { path = "vendor/glib" }
