name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview Hooversion without creating a release branch or publishing assets
        type: boolean
        default: true
      tag:
        description: Tag to publish or resume; run from that tag (published releases are never rebuilt)
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.23.2"
  PNPM_VERSION: "11.3.0"
  RUST_VERSION: "1.95.0"
  ARCH_SNAPSHOT: "2026/08/21"
  ARCH_IMAGE: "archlinux/archlinux@sha256:2685bf92cc6215cc922488ae8e80b4875f4bdf19fef648818b1742517ce27077"
  HOOVERSION_VERSION: "1.1.1"
  HOOLICY_VERSION: "0.3.2"

jobs:
  prepare:
    name: Prepare protected release PR
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.tag == ''
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: read
    outputs:
      current: ${{ steps.current.outputs.current || steps.manual.outputs.current }}
      prepared: ${{ steps.prepare_release.outputs.prepared }}
      tag: ${{ steps.prepare_release.outputs.tag }}
      version: ${{ steps.prepare_release.outputs.version }}
    steps:
      - name: Checkout candidate main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Reject stale workflow-run source
        id: current
        if: github.event_name == 'workflow_run'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          actual=$(git rev-parse refs/remotes/origin/main)
          if [[ "$actual" == "$EXPECTED_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale release preparation for $EXPECTED_SHA because main is $actual."
          fi
      - name: Mark manual source current
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: echo "current=true" >> "$GITHUB_OUTPUT"
      - name: Require successful exact-main CI
        if: steps.current.outputs.current == 'true' || steps.manual.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release/require-ci-success.sh "$(git rev-parse HEAD)"
      - name: Set up Node.js for the version hook
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Prepare Hooversion release branch
        id: prepare_release
        if: >-
          (steps.current.outputs.current == 'true' || steps.manual.outputs.current == 'true') &&
          (github.event_name == 'workflow_dispatch' || !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):'))
        uses: openhoo/hooversion/actions/prepare-release@ac503b23b9b36ebbf39ee6103713c81f1f18b64d # v1.1.1
        with:
          version: ${{ env.HOOVERSION_VERSION }}
          config: hooversion.yaml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      - name: Describe the protected release pull request
        if: steps.prepare_release.outputs.prepared == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.prepare_release.outputs.version }}
          RELEASE_TAG: ${{ steps.prepare_release.outputs.tag }}
        run: bash scripts/release/describe-release-pr.sh "$RELEASE_VERSION" "$RELEASE_TAG" main

  finalize:
    name: Finalize merged Hooversion tag
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_commit.message, 'chore(release): cutterhoochee ')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout merged release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify merged release is still current main
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_SHA"
          bash scripts/release/require-ci-success.sh "$EXPECTED_SHA"
      - name: Read merged release metadata
        id: meta
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          version=$(tr -d '[:space:]' < VERSION)
          tag="v${version}"
          subject=$(git log -1 --format=%s HEAD)
          prefix="chore(release): cutterhoochee $version"
          if [[ "$subject" != "$prefix" ]]; then
            suffix="${subject#"$prefix"}"
            [[ "$suffix" =~ ^\ \(#[1-9][0-9]*\)$ ]] || {
              echo "::error::merged commit is not the generated Cutterhoochee release commit" >&2
              exit 1
            }
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
      - name: Create or verify the annotated Hooversion release tag
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          remote_ref=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          if [[ -n "$remote_ref" ]]; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "hooversion $RELEASE_VERSION"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Dispatch tag-qualified asset publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG" \
            --field tag="$RELEASE_TAG" \
            --field dry_run=false

  preflight:
    name: Verify tagged release source
    if: >-
      (
        github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        !inputs.dry_run &&
        inputs.tag != '' &&
        github.ref == format('refs/tags/{0}', inputs.tag)
      )
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      ci_run_id: ${{ steps.require_ci.outputs.run_id }}
      ci_artifact_id: ${{ steps.require_ci.outputs.artifact_id }}
      ci_artifact_name: ${{ steps.require_ci.outputs.artifact_name }}
      publish: ${{ steps.publication.outputs.publish }}
    steps:
      - name: Set up Node.js for manifest verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Checkout immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Validate release tag and source identity
        id: meta
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          test "$commit" = "$(git rev-parse HEAD)"
          test "$commit" = "$GITHUB_SHA"
          version=${RELEASE_TAG#v}
          test "$(tr -d '[:space:]' < VERSION)" = "$version"
          node --version
          node scripts/release/sync-version.mjs --check
          subject=$(git log -1 --format=%s HEAD)
          prefix="chore(release): cutterhoochee $version"
          if [[ "$subject" != "$prefix" ]]; then
            suffix="${subject#"$prefix"}"
            [[ "$suffix" =~ ^\ \(#[1-9][0-9]*\)$ ]] || {
              echo "::error::release tag does not identify the generated Cutterhoochee release commit" >&2
              exit 1
            }
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main
          {
            echo "commit=$commit"
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Require successful exact-main CI and resolve verified AppImage
        id: require_ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release/require-ci-success.sh "${{ steps.meta.outputs.commit }}"
      - name: Preserve already published immutable releases
        id: publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          draft=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .draft")
          if [[ "$draft" == false ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG is already published; immutable assets are unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  native-build:
    name: Package exact-CI AppImage in pinned Arch
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    container:
      image: archlinux/archlinux@sha256:2685bf92cc6215cc922488ae8e80b4875f4bdf19fef648818b1742517ce27077
      options: --user root
    permissions:
      actions: read
      contents: read
    steps:
      - name: Pin Arch repositories to the verified archive snapshot
        run: |
          set -euo pipefail
          printf '%s\n' "Server = https://archive.archlinux.org/repos/${ARCH_SNAPSHOT}/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          pacman-key --init
          pacman-key --populate archlinux
      - name: Install pinned Arch release verification dependencies
        run: |
          set -euo pipefail
          pacman -Syyuu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel ca-certificates git jq nodejs \
            ffmpeg x264 gdk-pixbuf2 glycin libheif bubblewrap shared-mime-info
          test "$(pacman -Q ffmpeg)" = 'ffmpeg 2:9.0.1-1'
          test "$(pacman -Q x264)" = 'x264 3:0.165.r3222.b35605a-2'
      - name: Checkout immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.commit }}
      - name: Trust the container-mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download exact CI AppImage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.preflight.outputs.ci_artifact_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.ci_run_id }}
          path: ${{ runner.temp }}/cutterhoochee-ci-appimage
      - name: Verify exact CI AppImage provenance
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
          CI_RUN_ID: ${{ needs.preflight.outputs.ci_run_id }}
          CI_ARTIFACT_ID: ${{ needs.preflight.outputs.ci_artifact_id }}
          CI_ARTIFACT_NAME: ${{ needs.preflight.outputs.ci_artifact_name }}
        run: |
          set -euo pipefail
          bash scripts/release/verify-ci-appimage.sh \
            "$RUNNER_TEMP/cutterhoochee-ci-appimage" \
            "$RELEASE_VERSION" "$RELEASE_COMMIT" \
            "$CI_RUN_ID" "$CI_ARTIFACT_ID" "$CI_ARTIFACT_NAME"
      - name: Package verified native release assets
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          set -euo pipefail
          rm -rf dist
          bash scripts/release/package-linux-release.sh \
            "$RELEASE_VERSION" "$RELEASE_TAG" "$RELEASE_COMMIT" "$ARCH_IMAGE" "$ARCH_SNAPSHOT" \
            "$RUNNER_TEMP/cutterhoochee-ci-appimage/Cutterhoochee_${RELEASE_VERSION}_amd64.AppImage"
      - name: Upload unsigned native release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cutterhoochee-${{ needs.preflight.outputs.tag }}-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign, attest, and publish verified release
    needs:
      - preflight
      - native-build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.commit }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download fresh native release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cutterhoochee-${{ needs.preflight.outputs.tag }}-linux-x86_64
          path: dist
      - name: Verify exact native artifact set and source identity
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          set -euo pipefail
          appimage="dist/Cutterhoochee_${RELEASE_VERSION}_amd64.AppImage"
          archive="dist/cutterhoochee-${RELEASE_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          identity="dist/Cutterhoochee_${RELEASE_VERSION}_SOURCE-IDENTITY.txt"
          notices="dist/Cutterhoochee_${RELEASE_VERSION}_notices.tar.gz"
          license="dist/Cutterhoochee_${RELEASE_VERSION}_LICENSE"
          for asset in "$appimage" "$archive" "$identity" "$notices" "$license"; do
            test -s "$asset"
          done
          chmod 0755 "$appimage"
          bash scripts/release/verify-appimage.sh "$appimage" "$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          assert_identity() {
            awk -F= -v field="$1" -v expected="$2" '$1 == field { if (found++ || $2 != expected) bad=1 } END { exit (!found || bad) }' "$identity"
          }
          assert_identity project "$GITHUB_REPOSITORY"
          assert_identity commit "$RELEASE_COMMIT"
          assert_identity tag "$RELEASE_TAG"
          assert_identity version "$RELEASE_VERSION"
          assert_identity target x86_64-unknown-linux-gnu
          assert_identity appimage_sha256 "$(sha256sum "$appimage" | cut -d ' ' -f1)"
          cmp LICENSE "$license"
          tar -tzf "$archive" | grep -Fx "cutterhoochee-${RELEASE_VERSION}-x86_64-unknown-linux-gnu/LICENSE" >/dev/null
          tar -tzf "$archive" | grep -Fx "cutterhoochee-${RELEASE_VERSION}-x86_64-unknown-linux-gnu/notices/sidecar-manifest.json" >/dev/null
          tar -tzf "$notices" | grep -Fx notices/Cutterhoochee-LICENSE.txt >/dev/null
      - name: Generate SPDX source and dependency SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_SOURCE_NAME: Cutterhoochee
          SYFT_SOURCE_VERSION: ${{ needs.preflight.outputs.tag }}
          SYFT_SOURCE_SUPPLIER: "Organization: OpenHoo"
        with:
          path: .
          format: spdx-json
          output-file: dist/cutterhoochee_${{ needs.preflight.outputs.tag }}.spdx.json
          artifact-name: cutterhoochee-sbom.spdx.json
          syft-version: v1.51.1
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Generate checksums and sign every release asset
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          sbom="dist/cutterhoochee_${RELEASE_TAG}.spdx.json"
          test -s "$sbom"
          jq -e '.spdxVersion == "SPDX-2.3" and .name == "Cutterhoochee" and (.packages | length > 0)' "$sbom" >/dev/null
          assets=(
            "dist/Cutterhoochee_${RELEASE_VERSION}_amd64.AppImage"
            "dist/cutterhoochee-${RELEASE_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "dist/Cutterhoochee_${RELEASE_VERSION}_LICENSE"
            "dist/Cutterhoochee_${RELEASE_VERSION}_notices.tar.gz"
            "dist/Cutterhoochee_${RELEASE_VERSION}_SOURCE-IDENTITY.txt"
            "$sbom"
          )
          (
            cd dist
            sha256sum -- \
              "Cutterhoochee_${RELEASE_VERSION}_amd64.AppImage" \
              "cutterhoochee-${RELEASE_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
              "Cutterhoochee_${RELEASE_VERSION}_LICENSE" \
              "Cutterhoochee_${RELEASE_VERSION}_notices.tar.gz" \
              "Cutterhoochee_${RELEASE_VERSION}_SOURCE-IDENTITY.txt" \
              "cutterhoochee_${RELEASE_TAG}.spdx.json" \
              | LC_ALL=C sort -k2 > SHA256SUMS
          )
          assets+=(dist/SHA256SUMS)
          for asset in "${assets[@]}"; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
          done
      - name: Verify keyless Cosign signatures
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          assets=(
            "dist/Cutterhoochee_${RELEASE_VERSION}_amd64.AppImage"
            "dist/cutterhoochee-${RELEASE_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "dist/Cutterhoochee_${RELEASE_VERSION}_LICENSE"
            "dist/Cutterhoochee_${RELEASE_VERSION}_notices.tar.gz"
            "dist/Cutterhoochee_${RELEASE_VERSION}_SOURCE-IDENTITY.txt"
            "dist/cutterhoochee_${RELEASE_TAG}.spdx.json"
            dist/SHA256SUMS
          )
          for asset in "${assets[@]}"; do
            cosign verify-blob \
              --bundle "${asset}.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-name "$GITHUB_WORKFLOW" \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-ref "$GITHUB_REF" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              --certificate-github-workflow-trigger "$GITHUB_EVENT_NAME" \
              "$asset"
          done
      - name: Attest complete release asset set
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create or reuse draft GitHub release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Cutterhoochee $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Verify attestations and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)" = true
          policy=(
            --repo "$GITHUB_REPOSITORY"
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
            --source-ref "$GITHUB_REF"
            --source-digest "$GITHUB_SHA"
            --deny-self-hosted-runners
          )
          for asset in dist/*; do
            gh attestation verify "$asset" "${policy[@]}" >/dev/null
          done
          remote_commit=$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk '{ print $1 }')
          test "$remote_commit" = "$RELEASE_COMMIT"
          release_flags=(--verify-tag --draft=false)
          expected_prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
            expected_prerelease=true
          else
            release_flags+=(--latest)
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${release_flags[@]}"
          release=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)
          test "$(jq -r .isDraft <<<"$release")" = false
          test "$(jq -r .isPrerelease <<<"$release")" = "$expected_prerelease"
          for asset in dist/*; do
            gh release verify-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" >/dev/null
          done
